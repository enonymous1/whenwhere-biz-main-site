# Deploy the WhenWhere.biz main site to GitHub Pages.
#
# The page is a single self-contained index.html (exported from the
# WhenWhere.biz Main Site build) — no build step, no backend. Every push
# to main deploys it as-is, so the live demo is always current with the
# repo.
#
# One-time setup (repo owner): Settings -> Pages -> Build and deployment
# -> Source: GitHub Actions. Then push to main and watch this run.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The starter-workflow permission set: Pages deploy needs Pages write
# + OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
